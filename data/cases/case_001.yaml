validation:
  incident_name: "Huntington Beach Pipeline / San Pedro Bay Oil Spill"
  incident_type: "pipeline_failure"
  source_type: "pipeline" # vessel, pipeline, natural, unknown, other
  ground_truth_quality: "VERIFIED" # VERIFIED, PROBABLE, UNVERIFIED
  ground_truth_source: "NTSB Accident Report DCA22FM001 / USCG Investigation"
  ground_truth_confidence: 1.0
  reference_source_location:
    lon: -118.0500
    lat: 33.6000
    depth_m: 30.0
  reference_source_time_utc: "2021-10-02T01:00:00Z"
  reference_vessel_mmsi: null
  reference_vessel_name: null
  validation_role: "NEGATIVE_NON_VESSEL_CASE"
  evaluation_criteria:
    max_tolerated_vessel_support_state: "MODERATE_SUPPORT"
    false_high_support_threshold: 0.70
  notes: >
    Known origin is Amplify Energy Beta field underwater pipeline rupture (Pipeline corridor).
    Used as a NEGATIVE SAFETY CASE to verify that passing maritime traffic (5-10 km away)
    is NOT falsely attributed with HIGH_SUPPORT.


